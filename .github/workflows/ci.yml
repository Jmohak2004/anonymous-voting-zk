name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install circom
        run: |
          curl -L -o circom https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64
          chmod +x circom && sudo mv circom /usr/local/bin/circom
          circom --version
      - run: npm ci
      - run: npm --prefix frontend ci
      - name: Circuit tests
        run: npm run test:circuits
      - name: Contract tests
        run: npm test
      - name: Frontend tests and build
        run: |
          npm --prefix frontend test
          npm --prefix frontend run build
      - name: End-to-end flow
        run: npm run e2e
